<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axom Bikers Brigade (ABB)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Banner -->
  <header id="hero">
    <div class="hero-overlay">
      <h1>Axom Bikers Brigade</h1>
      <p>Ride Together • Live Free • ABB Spirit</p>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="#rides">Rides</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- Rides Section -->
  <section id="rides">
    <h2>Upcoming Rides</h2>
    <div class="ride-card">Ride 1: Guwahati to Shillong</div>
    <div class="ride-card">Ride 2: Kaziranga Adventure</div>
  </section>

  <!-- Gallery Section -->
  <section id="gallery">
    <h2>Gallery</h2>
    <div class="gallery-item">Photo 1</div>
    <div class="gallery-item">Photo 2</div>
    <div class="gallery-item">Photo 3</div>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact Us</h2>
    <p>Email: abb@example.com</p>
    <button class="contact-btn">Send Message</button>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Axom Bikers Brigade</p>
  </footer>

</body>
</html>
